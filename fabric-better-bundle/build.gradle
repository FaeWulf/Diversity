plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation("com.terraformersmc:modmenu:${modmenu_version}")
    //include(modImplementation("com.moulberry:mixinconstraints:1.0.1"))
    //include(modImplementation "org.ow2.asm:asm-tree:9.7")
    modImplementation "maven.modrinth:faewulfslib:${faewulfs_lib_version}-fabric,1.21.1"

    //lib
    modImplementation "com.electronwill.night-config:core:3.6.0"
    modImplementation "com.electronwill.night-config:toml:3.6.0"
}

loom {
    def aw = project(':common-better-bundle').file("src/main/resources/${mod_id_better_bundle}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id_better_bundle}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

tasks.withType(Javadoc).configureEach { enabled = false }
