plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://jm.gserv.me/repository/maven-public/"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
}

mixin {
    add(sourceSets.main, "${mod_id_better_bundle}.refmap.json")

    config("${mod_id_better_bundle}.forge.mixins.json")
    config("${mod_id_better_bundle}.client.mixins.json")
    config("${mod_id_better_bundle}.compat.mixins.json")
    config("${mod_id_better_bundle}.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id_better_bundle, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id_better_bundle}" {
            sourceSet sourceSets.main
        }
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common-better-bundle")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation 'org.jetbrains:annotations:24.0.1'

    // MixinExtras
    testCompileOnly(compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")))
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        version {
            strictly '[0.4.1,)'
        }
    }

    //lib
    implementation("com.electronwill.night-config:toml:3.6.0")
    modImplementation "maven.modrinth:faewulfslib:${faewulfs_lib_version}-forge,${minecraft_version}"
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id_better_bundle}.mixins.json, ${mod_id_better_bundle}.forge.mixins.json"
    ])
}

tasks.withType(Javadoc).configureEach { enabled = false }
